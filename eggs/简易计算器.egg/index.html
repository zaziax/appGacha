<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>简易计算器</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="appTitle">简易计算器</h1>
  </header>
  <main id="app">
    <div class="calculator">
      <div class="display">
        <div class="display-expression" id="expression"></div>
        <div class="display-input" id="display">0</div>
      </div>
      <div class="buttons" id="buttons">
        <button class="btn btn-clear" data-action="clear">C</button>
        <button class="btn btn-backspace" data-action="backspace">⌫</button>
        <button class="btn btn-operator" data-action="percent">%</button>
        <button class="btn btn-operator" data-action="divide">÷</button>

        <button class="btn" data-value="7">7</button>
        <button class="btn" data-value="8">8</button>
        <button class="btn" data-value="9">9</button>
        <button class="btn btn-operator" data-action="multiply">×</button>

        <button class="btn" data-value="4">4</button>
        <button class="btn" data-value="5">5</button>
        <button class="btn" data-value="6">6</button>
        <button class="btn btn-operator" data-action="subtract">−</button>

        <button class="btn" data-value="1">1</button>
        <button class="btn" data-value="2">2</button>
        <button class="btn" data-value="3">3</button>
        <button class="btn btn-operator" data-action="add">+</button>

        <button class="btn btn-negate" data-action="negate">±</button>
        <button class="btn" data-value="0">0</button>
        <button class="btn" data-value=".">.</button>
        <button class="btn btn-equals" data-action="equals">=</button>
      </div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
