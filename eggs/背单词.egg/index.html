<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>背单词</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>背单词</h1>
    <div class="stats" id="stats">—</div>
  </header>

  <form id="addForm" autocomplete="off">
    <input id="wordInput" placeholder="单词，如 serendipity" required>
    <input id="meaningInput" placeholder="释义，如 意外发现珍宝的运气" required>
    <button type="submit">收进词库</button>
  </form>

  <nav id="filters">
    <button data-filter="all" class="active">全部</button>
    <button data-filter="learning">在背</button>
    <button data-filter="mastered">已掌握</button>
  </nav>

  <main id="list"></main>
  <p id="empty" hidden>词库空空如也，先收一个单词进来吧。</p>

  <script src="app.js"></script>
</body>
</html>
