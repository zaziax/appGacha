<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>应用扭蛋机</title>
  <link rel="stylesheet" href="shelf.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">◓</span>
      <h1>应用扭蛋机</h1>
    </div>
    <div class="actions">
      <button id="wishBtn" class="primary" title="说出愿望，扭一颗应用">许个愿 ✦</button>
      <button id="importBtn">导入扭蛋</button>
      <button id="settingsBtn" title="模型设置">⚙</button>
    </div>
  </header>

  <main id="grid"></main>

  <div id="emptyState" hidden>
    <div class="capsule">◓</div>
    <p>收藏柜空空如也</p>
    <p class="sub">许个愿扭一颗，或者导入别人分享的 .egg</p>
  </div>

  <div id="wishMask" class="mask" hidden>
    <div class="dialog">
      <div id="wishForm">
        <h2>许个愿 ✦</h2>
        <p class="dialog-sub">说出你想要的小应用，机芯会为你扭一颗出来。数据、提醒、AI 它都会自带。</p>
        <textarea id="wishText" rows="4" placeholder="例如：我想要一个番茄钟，25 分钟专注 + 5 分钟休息，结束时提醒我，并统计每天完成了几个番茄"></textarea>
        <div class="dialog-actions">
          <button id="startWishBtn" class="primary">投币，开扭！</button>
          <button id="closeWishBtn">再想想</button>
        </div>
      </div>
      <div id="wishProgress" hidden>
        <h2 id="stageTitle">投币…</h2>
        <div class="gacha-anim"><span id="gachaBall">◓</span></div>
        <p class="dialog-sub" id="stageDetail">装配舱就位</p>
      </div>
      <div id="wishResult" hidden>
        <h2 id="resultTitle"></h2>
        <p class="dialog-sub" id="resultDetail"></p>
        <div class="dialog-actions">
          <button id="openNewEggBtn" class="primary" hidden>打开看看</button>
          <button id="retryWishBtn" hidden>再来一发 ◓</button>
          <button id="closeResultBtn">关闭</button>
        </div>
      </div>
    </div>
  </div>

  <div id="settingsMask" class="mask" hidden>
    <div class="dialog">
      <h2>模型设置</h2>
      <p class="dialog-sub">OpenAI 兼容接口（DeepSeek / Kimi / Qwen 等均可）。Key 加密存储在本机，蛋永远接触不到。</p>
      <label>接口地址 Base URL
        <input id="aiBaseURL" placeholder="https://api.deepseek.com/v1" spellcheck="false">
      </label>
      <label>模型名 Model
        <input id="aiModel" placeholder="deepseek-chat" spellcheck="false">
      </label>
      <label>API Key
        <input id="aiKey" type="password" placeholder="sk-…（留空表示沿用已保存的）" spellcheck="false">
      </label>
      <div class="dialog-actions">
        <span id="aiStatus"></span>
        <button id="testAiBtn">测试连接</button>
        <button id="saveAiBtn" class="primary">保存</button>
        <button id="closeSettingsBtn">关闭</button>
      </div>
    </div>
  </div>

  <div id="toast" hidden></div>

  <script src="shelf.js"></script>
</body>
</html>
