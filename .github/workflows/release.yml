name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    # 仅 Windows：macOS 在另一台 mac 设备上用 scripts/dist-mac.sh 手动签名+公证+发布；
    # Linux 无发布计划。
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build & Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist

      # electron-builder 的 GitHub publisher 已自动上传 latest.yml + 安装包到 Release。
      # 这里再补传一份 artifacts 作为冗余备份。
      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.yml
            release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
